# Diese Datei kommt nach: .github/workflows/schluessel.yml
#
# Sie wird GENAU EINMAL ausgefuehrt und erzeugt den Signaturschluessel
# fuer deine App. Danach kannst du sie im Repository loeschen.
#
# WICHTIG: Fuehre sie aus, SOLANGE das Repository noch privat ist.
# Bei oeffentlichen Repositories koennte sonst jeder das Ergebnis herunterladen.

name: Signaturschluessel erzeugen

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Schluessel erzeugen
        run: |
          PASS=$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | cut -c1-28)
          echo "::add-mask::$PASS"

          keytool -genkeypair \
            -keystore nur-islam.jks \
            -alias nurislam \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Nur Islam, OU=App, O=Nur Islam, L=Koeln, S=NRW, C=DE"

          mkdir -p out
          base64 -w0 nur-islam.jks > out/KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > out/KEYSTORE_PASSWORD.txt
          cp nur-islam.jks out/

          cat > out/ANLEITUNG.txt <<'TXT'
          So geht es weiter:

          1. Im Repository auf Settings -> Secrets and variables -> Actions
          2. Auf "New repository secret" und ZWEI Geheimnisse anlegen:

          Name: KEYSTORE_BASE64
          Wert: der gesamte Inhalt der Datei KEYSTORE_BASE64.txt
          (eine sehr lange Zeile - alles markieren und kopieren)

          Name: KEYSTORE_PASSWORD
          Wert: der Inhalt der Datei KEYSTORE_PASSWORD.txt
          (ohne Leerzeichen oder Zeilenumbruch am Ende)

          3. Die Datei nur-islam.jks an einem sicheren Ort aufbewahren
          (z. B. Passwort-Manager oder eigene Cloud). Geht sie verloren,
          kannst du nie wieder ein Update fuer deine App veroeffentlichen.
          Alle Nutzer muessten dann deinstallieren und neu installieren.

          4. Diesen Workflow-Lauf loeschen (Actions -> der Lauf -> ... -> Delete)
          und die Datei .github/workflows/schluessel.yml aus dem Repository
          entfernen. Sie wird nicht mehr gebraucht.

          5. Erst DANACH das Repository auf oeffentlich stellen.
          TXT

          echo "Fertig. Das Ergebnis liegt unter Artifacts."

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: signaturschluessel
          path: out
          retention-days: 1
