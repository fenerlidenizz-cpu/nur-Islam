# Diese Datei liegt auf GitHub unter .github/workflows/main.yml
# Sie baut die fertige APK und legt sie unter "Artifacts" zum Download ab.
#
# main.dart und pubspec.yaml duerfen im Hauptverzeichnis liegen —
# der Workflow sortiert sie selbst ein und erzeugt das Android-Projekt.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dateien einsortieren und sichern
        run: |
          mkdir -p lib
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then
            mv main.dart lib/main.dart
            echo "main.dart nach lib/ verschoben."
          fi
          if [ ! -f lib/main.dart ]; then
            echo "FEHLER: main.dart wurde nicht gefunden."
            exit 1
          fi
          if [ ! -f pubspec.yaml ]; then
            echo "FEHLER: pubspec.yaml wurde nicht gefunden."
            exit 1
          fi
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp lib/main.dart /tmp/keep/main.dart

      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --org com.nurislam --project-name nur_islam .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/main.dart lib/main.dart

      - name: Berechtigungen und App-Name eintragen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Nur Islam"#' "$MANIFEST"
          grep -o 'android:label="[^"]*"' "$MANIFEST"

      # Darf fehlschlagen — dann bleibt einfach das Standard-Symbol.
      - name: App-Symbol erzeugen (goldener Halbmond auf Lila)
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages --quiet pillow \
            || python3 -m pip install --quiet pillow \
            || pip3 install --quiet pillow
          mkdir -p assets/icon
          cat > make_icon.py <<'PYEOF'
          from PIL import Image, ImageDraw

          S = 1024
          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)

          # Hintergrund im Aubergine-Ton der App
          d.rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * 0.22), fill=(61, 44, 82, 255))
          d.rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * 0.22),
                              outline=(201, 162, 39, 130), width=int(S * 0.012))

          # Halbmond: grosser Kreis minus versetzter Kreis
          mask = Image.new("L", (S, S), 0)
          m = ImageDraw.Draw(mask)
          r = int(S * 0.30)
          cx, cy = int(S * 0.52), int(S * 0.50)
          m.ellipse([cx - r, cy - r, cx + r, cy + r], fill=255)
          r2 = int(r * 0.86)
          cx2, cy2 = cx + int(r * 0.34), cy - int(r * 0.12)
          m.ellipse([cx2 - r2, cy2 - r2, cx2 + r2, cy2 + r2], fill=0)

          gold = Image.new("RGBA", (S, S), (212, 175, 55, 255))
          img.paste(gold, (0, 0), mask)

          # kleiner Stern in der Mondsichel
          try:
              d.regular_polygon((int(S * 0.70), int(S * 0.34), int(S * 0.055)), 5,
                                rotation=-18, fill=(212, 175, 55, 255))
          except Exception:
              pass

          img.save("assets/icon/icon.png")
          print("Symbol erzeugt")
          PYEOF
          python3 make_icon.py
          rm -f make_icon.py
          ls -l assets/icon

      - name: Symbol einbauen
        continue-on-error: true
        run: |
          if [ ! -f assets/icon/icon.png ]; then
            echo "Kein Symbol vorhanden - Schritt wird uebersprungen."
            exit 0
          fi
          cp pubspec.yaml /tmp/keep/pubspec.before-icon.yaml
          flutter pub add --dev flutter_launcher_icons
          cat >> pubspec.yaml <<'CFGEOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            adaptive_icon_background: "#3D2C52"
            adaptive_icon_foreground: "assets/icon/icon.png"
          CFGEOF
          flutter pub get
          dart run flutter_launcher_icons || cp /tmp/keep/pubspec.before-icon.yaml pubspec.yaml

      # Startbildschirm-Widgets: nativer Android-Teil.
      # Darf fehlschlagen - dann baut die App ohne Widgets weiter.
      - name: Widgets einbauen
        continue-on-error: true
        run: |
          set -e
          PKG=android/app/src/main/kotlin/com/nurislam/nur_islam
          RES=android/app/src/main/res
          mkdir -p "$PKG" "$RES/layout" "$RES/xml" "$RES/drawable"

          cat > "$RES/drawable/widget_bg.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <corners android:radius="20dp" />
              <solid android:color="#FFFFFFFF" />
          </shape>
          XML

          cat > "$RES/layout/widget_times.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/times_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <ImageView
                  android:id="@+id/times_bg"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY"
                  android:src="@drawable/widget_bg"
                  android:contentDescription="@null" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:padding="10dp">

                  <TextView
                      android:id="@+id/times_header"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:maxLines="1"
                      android:ellipsize="end"
                      android:textSize="10sp"
                      android:textColor="#CCFFFFFF" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">

                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                          <TextView android:id="@+id/n1" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="9sp"
                              android:maxLines="1" android:textColor="#B3FFFFFF" />
                          <TextView android:id="@+id/t1" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="14sp"
                              android:textStyle="bold" android:textColor="#FFFFFFFF" />
                      </LinearLayout>

                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                          <TextView android:id="@+id/n2" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="9sp"
                              android:maxLines="1" android:textColor="#B3FFFFFF" />
                          <TextView android:id="@+id/t2" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="14sp"
                              android:textStyle="bold" android:textColor="#FFFFFFFF" />
                      </LinearLayout>

                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                          <TextView android:id="@+id/n3" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="9sp"
                              android:maxLines="1" android:textColor="#B3FFFFFF" />
                          <TextView android:id="@+id/t3" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="14sp"
                              android:textStyle="bold" android:textColor="#FFFFFFFF" />
                      </LinearLayout>

                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                          <TextView android:id="@+id/n4" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="9sp"
                              android:maxLines="1" android:textColor="#B3FFFFFF" />
                          <TextView android:id="@+id/t4" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="14sp"
                              android:textStyle="bold" android:textColor="#FFFFFFFF" />
                      </LinearLayout>

                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                          <TextView android:id="@+id/n5" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="9sp"
                              android:maxLines="1" android:textColor="#B3FFFFFF" />
                          <TextView android:id="@+id/t5" android:layout_width="wrap_content"
                              android:layout_height="wrap_content" android:textSize="14sp"
                              android:textStyle="bold" android:textColor="#FFFFFFFF" />
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          XML

          cat > "$RES/layout/widget_qibla.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/qibla_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <ImageView
                  android:id="@+id/qibla_bg"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY"
                  android:src="@drawable/widget_bg"
                  android:contentDescription="@null" />

              <ImageView
                  android:id="@+id/qibla_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_margin="6dp"
                  android:scaleType="fitCenter"
                  android:contentDescription="@null" />
          </FrameLayout>
          XML

          cat > "$RES/xml/widget_times_info.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="40dp"
              android:targetCellWidth="5"
              android:targetCellHeight="1"
              android:minResizeWidth="180dp"
              android:minResizeHeight="40dp"
              android:updatePeriodMillis="1800000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:previewImage="@mipmap/ic_launcher"
              android:initialLayout="@layout/widget_times" />
          XML

          cat > "$RES/xml/widget_qibla_info.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:minResizeWidth="40dp"
              android:minResizeHeight="40dp"
              android:updatePeriodMillis="1800000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:previewImage="@mipmap/ic_launcher"
              android:initialLayout="@layout/widget_qibla" />
          XML
          echo "Layouts geschrieben."

          cat > "$PKG/NurWidgets.kt" <<'KT'
          package com.nurislam.nur_islam

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
 import android.content.ComponentName
         import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.widget.RemoteViews
          import org.json.JSONArray
          import org.json.JSONObject

          object WidgetData {
              fun prefs(context: Context) =
                  context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)

              fun alpha(context: Context): Int =
                  prefs(context).getLong("flutter.widget_alpha", 170L).toInt().coerceIn(0, 255)

              fun colour(context: Context, key: String, fallback: Int): Int {
                  val v = prefs(context).getLong(key, -1L)
                  return if (v < 0) fallback else (0xFF000000.toInt() or v.toInt())
              }

              fun openApp(context: Context, route: String? = null, requestCode: Int = 0): PendingIntent {
                  val intent = context.packageManager.getLaunchIntentForPackage(context.packageName)
                  if (route != null) {
                      intent?.putExtra("route", route)
                  }
                  return PendingIntent.getActivity(
                      context, requestCode, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
              }
          }

          /** Breites Feld mit den fuenf Gebetszeiten. */
          class PrayerWidgetProvider : AppWidgetProvider() {
              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == "android.intent.action.MY_PACKAGE_REPLACED") {
                      val mgr = AppWidgetManager.getInstance(context)
                      val ids = mgr.getAppWidgetIds(ComponentName(context, PrayerWidgetProvider::class.java))
                      onUpdate(context, mgr, ids)
                  }
              }

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  for (id in ids) render(context, manager, id)
              }

              private fun render(context: Context, manager: AppWidgetManager, id: Int) {
                  val views = RemoteViews(context.packageName, R.layout.widget_times)
                  val gold = WidgetData.colour(context, "flutter.widget_gold", Color.parseColor("#D8B45A"))
                  val bg = WidgetData.colour(context, "flutter.widget_bg", Color.parseColor("#080F1F"))

                  views.setInt(R.id.times_bg, "setColorFilter", bg)
                  views.setInt(R.id.times_bg, "setImageAlpha", WidgetData.alpha(context))

                  val nameIds = intArrayOf(R.id.n1, R.id.n2, R.id.n3, R.id.n4, R.id.n5)
                  val timeIds = intArrayOf(R.id.t1, R.id.t2, R.id.t3, R.id.t4, R.id.t5)

                  val raw = WidgetData.prefs(context).getString("flutter.widget_times", null)
                  if (raw == null) {
                      views.setTextViewText(R.id.times_header, "Nur Islam")
                      for (i in 0..4) {
                          views.setTextViewText(nameIds[i], "")
                          views.setTextViewText(timeIds[i], "--:--")
                      }
                  } else {
                      try {
                          val json = JSONObject(raw)
                          val header = json.optString("date", "") + "  ·  " + json.optString("label", "")
                          views.setTextViewText(R.id.times_header, header)
                          val next = json.optString("next", "")
                          val times: JSONArray = json.optJSONArray("times") ?: JSONArray()
                          for (i in 0..4) {
                              if (i < times.length()) {
                                  val row = times.getJSONArray(i)
                                  val name = row.optString(0, "")
                                  views.setTextViewText(nameIds[i], name)
                                  views.setTextViewText(timeIds[i], row.optString(1, "--:--"))
                                  val isNext = name == next
                                  views.setTextColor(timeIds[i], if (isNext) gold else Color.WHITE)
                                  views.setTextColor(nameIds[i], if (isNext) gold else Color.parseColor("#B3FFFFFF"))
                              } else {
                                  views.setTextViewText(nameIds[i], "")
                                  views.setTextViewText(timeIds[i], "")
                              }
                          }
                      } catch (e: Exception) {
                          views.setTextViewText(R.id.times_header, "Nur Islam")
                      }
                  }

                  views.setOnClickPendingIntent(R.id.times_root, WidgetData.openApp(context))
                  manager.updateAppWidget(id, views)
              }
          }

          /** Kompass mit fester Richtung zur Kaaba. */
          class QiblaWidgetProvider : AppWidgetProvider() {
              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == "android.intent.action.MY_PACKAGE_REPLACED") {
                      val mgr = AppWidgetManager.getInstance(context)
                      val ids = mgr.getAppWidgetIds(ComponentName(context, QiblaWidgetProvider::class.java))
                      onUpdate(context, mgr, ids)
                  }
              }

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  for (id in ids) render(context, manager, id)
              }

              private fun render(context: Context, manager: AppWidgetManager, id: Int) {
                  val views = RemoteViews(context.packageName, R.layout.widget_qibla)
                  val gold = WidgetData.colour(context, "flutter.widget_gold", Color.parseColor("#D8B45A"))
                  val bg = WidgetData.colour(context, "flutter.widget_bg", Color.parseColor("#080F1F"))

                  views.setInt(R.id.qibla_bg, "setColorFilter", bg)
                  views.setInt(R.id.qibla_bg, "setImageAlpha", WidgetData.alpha(context))

                  val bearing = WidgetData.prefs(context)
                      .getString("flutter.widget_qibla", null)?.toFloatOrNull() ?: 0f

                  views.setImageViewBitmap(R.id.qibla_image, compass(bearing, gold))
                  views.setOnClickPendingIntent(R.id.qibla_root, WidgetData.openApp(context, "qibla", 1))
                  manager.updateAppWidget(id, views)
              }

              private fun compass(bearing: Float, gold: Int): Bitmap {
                  val size = 320
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val cx = size / 2f
                  val r = size / 2f - 14f

                  val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = 4f
                      color = gold
                      alpha = 150
                  }
                  c.drawCircle(cx, cx, r, ring)

                  val ticks = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      strokeWidth = 3f
                      color = Color.WHITE
                      alpha = 110
                  }
                  for (deg in 0 until 360 step 30) {
                      val rad = Math.toRadians((deg - 90).toDouble())
                      val x1 = cx + Math.cos(rad).toFloat() * (r - 4)
                      val y1 = cx + Math.sin(rad).toFloat() * (r - 4)
                      val x2 = cx + Math.cos(rad).toFloat() * (r - 16)
                      val y2 = cx + Math.sin(rad).toFloat() * (r - 16)
                      c.drawLine(x1, y1, x2, y2, ticks)
                  }

                  val label = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#E06050")
                      textSize = 30f
                      textAlign = Paint.Align.CENTER
                      isFakeBoldText = true
                  }
                  c.drawText("N", cx, 34f, label)

                  // Nadel zur Kaaba
                  c.save()
                  c.rotate(bearing, cx, cx)
                  val needle = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = gold }
                  val p = Path()
                  p.moveTo(cx, cx - r + 26)
                  p.lineTo(cx - 20, cx + 26)
                  p.lineTo(cx, cx + 12)
                  p.lineTo(cx + 20, cx + 26)
                  p.close()
                  c.drawPath(p, needle)
                  c.restore()

                  val dot = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
                  c.drawCircle(cx, cx, 7f, dot)

                  val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = 34f
                      textAlign = Paint.Align.CENTER
                      isFakeBoldText = true
                  }
                  c.drawText("${Math.round(bearing)}°", cx, size - 16f, text)
                  return bmp
              }
          }
          KT
          echo "Kotlin geschrieben."
          cat > "$PKG/MainActivity.kt" <<'KT2'
          package com.nurislam.nur_islam

          import android.content.Intent
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.nurislam.nur_islam/route"
              private var methodChannel: MethodChannel? = null
              private var pendingRoute: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  pendingRoute = intent?.getStringExtra("route")
                  super.onCreate(savedInstanceState)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      if (call.method == "getInitialRoute") {
                          result.success(pendingRoute)
                          pendingRoute = null
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val route = intent.getStringExtra("route")
                  if (route != null) {
                      methodChannel?.invokeMethod("openRoute", route)
                  }
              }
          }
          KT2
          echo "MainActivity.kt geschrieben."

          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          text = open(path, encoding="utf-8").read()
          if "PrayerWidgetProvider" not in text:
              block = """
              <receiver
                  android:name=".PrayerWidgetProvider"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/widget_times_info" />
              </receiver>

              <receiver
                  android:name=".QiblaWidgetProvider"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                  </intent-filter>
                  <meta-data
                      android:name="android.appwidget.provider"
                      android:resource="@xml/widget_qibla_info" />
              </receiver>
          """
              text = text.replace("</application>", block + "    </application>", 1)
              open(path, "w", encoding="utf-8").write(text)
              print("Manifest ergaenzt.")
          else:
              print("Manifest war schon ergaenzt.")
          PYEOF
          grep -c "receiver" android/app/src/main/AndroidManifest.xml


      - name: Abhaengigkeiten laden
        run: flutter pub get

      - name: Statische Pruefung (nur als Hinweis)
        run: flutter analyze || true

      - name: Release-APK bauen
        run: |
          BUILD_NR=$(( 100 + ${{ github.run_number }} ))
          echo "Interne Versionsnummer: $BUILD_NR"
          if flutter build apk --release --build-number=$BUILD_NR; then
            echo "Build erfolgreich."
          else
            echo "::warning::Build fehlgeschlagen - Widgets werden entfernt und erneut versucht."
            rm -f android/app/src/main/kotlin/com/nurislam/nur_islam/NurWidgets.kt
            rm -f android/app/src/main/res/layout/widget_times.xml
            rm -f android/app/src/main/res/layout/widget_qibla.xml
            rm -f android/app/src/main/res/xml/widget_times_info.xml
            rm -f android/app/src/main/res/xml/widget_qibla_info.xml
            python3 - <<'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"\s*<receiver[^>]*?(PrayerWidgetProvider|QiblaWidgetProvider).*?</receiver>",
                        "", text, flags=re.S)
          open(path, "w", encoding="utf-8").write(text)
          print("Widget-Eintraege aus dem Manifest entfernt.")
          PYEOF
            flutter clean
            flutter pub get
            flutter build apk --release --build-number=$BUILD_NR
          fi

      # Feste Signatur: nur so lassen sich Updates ueber die alte Version
      # installieren, ohne dass Nutzer deinstallieren muessen.
      - name: APK mit festem Schluessel signieren
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Signaturschluessel hinterlegt. Die APK ist mit einem"
            echo "::warning::Wegwerf-Schluessel signiert - Updates lassen sich damit nicht"
            echo "::warning::ueber eine bestehende Installation legen."
            exit 0
          fi

          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "Build-Tools: $BT"

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/nur-islam.jks

          "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/nur-islam.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias nurislam \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$APK" /tmp/aligned.apk

          "$BT/apksigner" verify --print-certs "$APK" | head -4
          rm -f /tmp/nur-islam.jks /tmp/aligned.apk
          echo "Mit festem Schluessel signiert."

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nur-islam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release veroeffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//' | cut -d'+' -f1)
          TAG="V.$VERSION"
          APK=build/app/outputs/flutter-apk/app-release.apk
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APK" --repo "${{ github.repository }}" --title "Nur Islam $VERSION" --notes "Automatisches Update ueber GitHub Actions."
          fi
