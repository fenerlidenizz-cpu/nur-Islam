# Diese Datei wird auf GitHub unter "Actions" eingefuegt.
# Sie baut die fertige APK und legt sie unter "Artifacts" zum Download ab.
#
# Die Dateien main.dart und pubspec.yaml duerfen einfach im Hauptverzeichnis
# des Repositories liegen - der Workflow sortiert sie selbst an die
# richtige Stelle und erzeugt das Android-Projekt.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dateien einsortieren und sichern
        run: |
          mkdir -p lib
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then
            mv main.dart lib/main.dart
            echo "main.dart nach lib/ verschoben."
          fi
          if [ ! -f lib/main.dart ]; then
            echo "FEHLER: main.dart wurde nicht gefunden."
            exit 1
          fi
          if [ ! -f pubspec.yaml ]; then
            echo "FEHLER: pubspec.yaml wurde nicht gefunden."
            exit 1
          fi
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp lib/main.dart /tmp/keep/main.dart

      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --org com.nurislam --project-name nur_islam .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/main.dart lib/main.dart

      - name: Berechtigungen in das Manifest eintragen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />\n    <application#' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Abhaengigkeiten laden
        run: flutter pub get

      - name: Statische Pruefung (nur als Hinweis)
        run: flutter analyze || true

      - name: Release-APK bauen
        run: flutter build apk --release

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nur-islam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
