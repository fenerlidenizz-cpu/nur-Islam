# Diese Datei wird auf GitHub unter "Actions" eingefuegt.
# Sie baut die fertige APK und legt sie unter "Artifacts" zum Download ab.
#
# Die Dateien main.dart und pubspec.yaml duerfen einfach im Hauptverzeichnis
# des Repositories liegen - der Workflow sortiert sie selbst an die
# richtige Stelle und erzeugt das Android-Projekt.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dateien einsortieren und sichern
        run: |
          mkdir -p lib
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then
            mv main.dart lib/main.dart
            echo "main.dart nach lib/ verschoben."
          fi
          if [ ! -f lib/main.dart ]; then
            echo "FEHLER: main.dart wurde nicht gefunden."
            exit 1
          fi
          if [ ! -f pubspec.yaml ]; then
            echo "FEHLER: pubspec.yaml wurde nicht gefunden."
            exit 1
          fi
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp lib/main.dart /tmp/keep/main.dart

      - name: Android-Projekt erzeugen
        run: |
          flutter create --platforms=android --org com.nurislam --project-name nur_islam .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/main.dart lib/main.dart

      - name: Berechtigungen in das Manifest eintragen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n    <application#' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: App-Namen setzen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Nur Islam"#' "$MANIFEST"
          grep -o 'android:label="[^"]*"' "$MANIFEST"

      - name: App-Symbol erzeugen (goldener Halbmond auf Lila)
        run: |
          pip install --quiet pillow
          mkdir -p assets/icon
          python3 - <<'ICON'
          from PIL import Image, ImageDraw
          S = 1024
          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          # Hintergrund im Aubergine-Farbton der App
          d.rounded_rectangle([0, 0, S, S], radius=int(S*0.22), fill=(61, 44, 82, 255))
          d.rounded_rectangle([0, 0, S, S], radius=int(S*0.22),
                              outline=(201, 162, 39, 120), width=int(S*0.012))
          # Halbmond: grosser Kreis minus versetzter Kreis
          moon = Image.new("L", (S, S), 0)
          md = ImageDraw.Draw(moon)
          r = int(S*0.30)
          cx, cy = int(S*0.52), int(S*0.50)
          md.ellipse([cx-r, cy-r, cx+r, cy+r], fill=255)
          r2 = int(r*0.86)
          cx2, cy2 = cx + int(r*0.34), cy - int(r*0.12)
          md.ellipse([cx2-r2, cy2-r2, cx2+r2, cy2+r2], fill=0)
          gold = Image.new("RGBA", (S, S), (212, 175, 55, 255))
          img.paste(gold, (0, 0), moon)
          # kleiner Stern
          sr = int(S*0.055)
          sx, sy = int(S*0.70), int(S*0.34)
          d.regular_polygon((sx, sy, sr), 5, rotation=-18, fill=(212, 175, 55, 255))
          img.save("assets/icon/icon.png")
          print("Symbol erzeugt")
          ICON
          ls -l assets/icon

      - name: Symbol in das Projekt einbauen
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat >> pubspec.yaml <<'CFG'

          flutter_launcher_icons:
            android: true
            ios: true
            image_path: "assets/icon/icon.png"
            adaptive_icon_background: "#3D2C52"
            adaptive_icon_foreground: "assets/icon/icon.png"
            remove_alpha_ios: true
          CFG
          flutter pub get
          dart run flutter_launcher_icons

      - name: Abhaengigkeiten laden
        run: flutter pub get

      - name: Statische Pruefung (nur als Hinweis)
        run: flutter analyze || true

      - name: Release-APK bauen
        run: flutter build apk --release

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nur-islam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
